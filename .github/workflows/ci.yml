name: CI

# Run on every push and on pull requests.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the ingester on the sample files
        # The full pipeline (stages 1-3) needs Datasets/, which is gitignored and
        # not in CI. The committed sample files exercise the bring-your-own-data
        # path end to end instead: format detection, unit conversion, scoring,
        # and the ambiguous-file STOP.
        run: |
          set -e
          python src/ingest.py samples/sample_A_long_mmbtu.csv
          python src/ingest.py samples/sample_B_wide_kwh.csv
          # Sample C is intentionally ambiguous; the ingester prints AMBIGUOUS and
          # writes a report rather than failing. Assert it did NOT score.
          out=$(python src/ingest.py samples/sample_C_ambiguous.csv)
          echo "$out"
          echo "$out" | grep -q "AMBIGUOUS" || (echo "Expected sample C to be flagged ambiguous" && exit 1)

      - name: Run property-based tests
        # Data-driven properties skip cleanly when data/processed/ is absent (CI
        # has no Datasets/); the pure-function properties always run.
        run: python -m pytest tests/test_properties.py -q

  docker:
    # Build the container so CI fails if the image or app breaks.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t heat-check:ci .

      - name: Smoke-test the container (/healthz and /upload)
        run: |
          set -e
          docker run -d --name hc -e PORT=8000 -p 8000:8000 heat-check:ci
          # Wait for the app to come up.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/upload >/dev/null
          docker rm -f hc
